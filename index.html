<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween Mini Games — KDS</title>
<meta name="description" content="Halloween Mini Games — KDS: Vampire Run, Ghost Hunt, Memory Match">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎃%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Creepster&family=Itim&family=Kanit:wght@500;700&family=Mali:wght@400;600&family=Noto+Sans+Thai:wght@400;700&family=Pixelify+Sans&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
</head><body>
<div id="bg"></div>
<main>
<header><div class="logo">🎃 Halloween Mini Games — KDS</div><div><button class="chip" id="thm">🎨 Theme</button> <span class="chip sy" id="sync">💾 Local</span> <button class="chip" id="snd">🔇 Sound Off</button> <button class="chip" id="who"></button></div></header>

<section class="view" id="v-name"><div class="name-box"><div style="font-size:80px" class="gc" style="border:0">🎃</div><h2>Enter Your Name</h2>
<input id="ni" maxlength="14" placeholder="ชื่อของคุณ" autocomplete="off"><button class="btn" id="go">ENTER HALLOWEEN</button></div></section>

<section class="view" id="v-home"><h1>HALLOWEEN<br>MINI GAMES — KDS</h1><p class="sub">เลือกเกม ทำคะแนนให้สูงที่สุด 👻</p>
<div class="games" id="gl"></div>
<h2>🏆 LEADERBOARD</h2><div class="gsel" id="gsel"></div><div id="lb"></div></section>

<section class="view" id="v-game"><div class="hud"><button class="chip" id="back">← Back</button><b id="gt"></b><span class="t" id="tm"></span><span class="s" id="sc">0</span></div><div id="arena"></div><p class="msg" id="hint"></p></section>

<section class="view" id="v-over"><div class="center"><h1 id="oh">GAME OVER</h1><p class="sub">YOUR SCORE</p><div class="big" id="os">0</div><h2 id="ost"></h2><p class="sub" id="ox"></p><p class="sub" id="orank"></p>
<div class="row"><button class="btn" id="again">PLAY AGAIN</button><button class="btn alt" id="other">OTHER GAMES</button><button class="chip" id="tolb">LEADERBOARD</button></div></div></section>
</main><aside class="studio" id="studio" hidden></aside>
<script type="module" src="/src/main.js"></script>
</body></html>
